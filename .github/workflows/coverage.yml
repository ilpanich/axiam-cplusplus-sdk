name: coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  coverage:
    name: llvm-cov coverage → Coveralls
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev \
                                  clang llvm libclang-rt-dev

      - name: Configure with source-based coverage
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAXIAM_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate"

      - name: Build
        run: cmake --build build -j

      - name: Run tests with profiling
        working-directory: build
        run: LLVM_PROFILE_FILE=axiam.profraw ./tests/axiam_cpp_tests

      - name: Produce lcov report (logic layer)
        working-directory: build
        run: |
          llvm-profdata merge -sparse axiam.profraw -o axiam.profdata
          llvm-cov export ./tests/axiam_cpp_tests -instr-profile=axiam.profdata \
            -format=lcov \
            ../src ../include/axiam > coverage.lcov
          llvm-cov report ./tests/axiam_cpp_tests -instr-profile=axiam.profdata \
            ../src ../include/axiam

      # Regression gate: fail if line coverage of the logic layer drops below the
      # floor. Line coverage is computed from the DA records in the lcov report
      # (a[2] is the hit count for each instrumented line) — note this is a
      # DIFFERENT denominator from the "Lines" column `llvm-cov report` prints
      # in the step above, so the two figures do not match and only this one
      # gates.
      #
      # The floor was 95 against a claimed "~99%" that this metric never
      # actually showed: measured, it was 95.88% — 0.88pp of margin, not four
      # points. The §12 refusal-path suite (tests/test_oidc_errors.cpp) and the
      # sender-constrained authenticator cases took it to 97.36%, so 96 restores
      # a real margin against a number this job computes. Ratchet it the same
      # way: only ever to a value measured here, never to an estimate.
      #
      # 96 -> 96.5 against a measured 97.13%. The refusal-path pass that earned
      # it added the UMA Protection API malformed-body arms, the §14 device
      # grant's three failure arms, the §12.7.3 logout-token rules, the JWKS
      # failed-refetch path, the §11.5 AuthzError rethrow and the unquoted
      # `WWW-Authenticate` parameter form.
      #
      # MIND THE MARGIN — this number is not perfectly reproducible. The §9
      # single-flight tests are genuinely concurrent, so which of the
      # owner/waiter arms execute depends on scheduling: over repeated local
      # runs the figure sat at 97.13% but dropped to 96.98% roughly one run in
      # twelve. The floor therefore keeps ~0.5pp under the WORST observed value,
      # not under the best. A gate that flaps teaches people to re-run CI until
      # it passes, which is worse than no gate.
      #
      # Do not expect to reach 100 here. What is left is, in order:
      #   * src/srp.cpp argon2id (~25 lines) — OpenSSL only ships the ARGON2ID
      #     EVP_KDF from 3.2, and ubuntu-latest is still 3.0.x, so the fetch
      #     fails and the derivation body cannot execute. Reachable only by
      #     building CI against a newer libcrypto.
      #   * src/client_impl.hpp execute()'s 401-refresh branch (16 lines) —
      #     dead: every call site passes allow_refresh=false. The live
      #     refresh-on-401 path is the telemetry-instrumented one above it.
      #   * three `resp.transport_error` guards in src/oidc.cpp (8 lines) —
      #     dead: Impl::send_raw already throws NetworkError on a transport
      #     error, so those responses never reach the guards.
      #   * OpenSSL/RAND_bytes/HMAC failure arms and OwnerScope's
      #     abort-before-publish destructor — defensive, unreachable without
      #     fault injection.
      # Cover the reachable ones before touching this number again.
      - name: Enforce coverage floor
        working-directory: build
        run: |
          set -euo pipefail
          total=$(awk -F: '
            /^DA:/ { split($2, a, ","); t++; if (a[2]+0 > 0) c++ }
            END { printf "%.2f", (t ? 100*c/t : 0) }
          ' coverage.lcov)
          echo "Line coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t+0 >= 96.5) ? 0 : 1 }' || {
            echo "::error::coverage ${total}% is below the 96.5% floor"; exit 1;
          }

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: build/coverage.lcov
          format: lcov
        continue-on-error: true
