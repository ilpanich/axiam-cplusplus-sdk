name: sdk-ci-cpp

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-test:
    name: build + test (${{ matrix.cxx }}, C++${{ matrix.std }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two axes. The COMPILER axis (g++, clang++) was already here and is
        # unchanged. The STANDARD axis is new, and is floor + newest: C++17 is
        # what CMakeLists.txt declares and every consumer inherits by default,
        # C++23 is the newest published standard. C++20 sits between two green
        # legs.
        #
        # The standard axis is not cosmetic here — it found a real defect the
        # moment it was added. tests/test_opaque_binding.cpp assigned a `u8""`
        # literal to a std::string, which is fine in C++17 and a HARD ERROR from
        # C++20, where such a literal is `const char8_t[]`. Every consumer
        # building this SDK at C++20 or later hit it; nothing in CI did.
        #
        # tests/test_version_policy.cpp fails the build if this list,
        # CMakeLists.txt and axiam::kMinCxxStandard stop agreeing.
        include:
          - { cc: gcc,   cxx: g++,     std: 17 }
          - { cc: clang, cxx: clang++, std: 17 }
          - { cc: gcc,   cxx: g++,     std: 23 }
          - { cc: clang, cxx: clang++, std: 23 }
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev clang

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DAXIAM_BUILD_TESTS=ON -DAXIAM_BUILD_EXAMPLES=ON
          -DCMAKE_CXX_STANDARD=${{ matrix.std }}

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # CONTRACT.md §22.11/§22.13: the sample drives the LIBRARY's reactor
      # runtime over a transport that replays the committed §22.13 reference
      # vectors, and exits non-zero on any byte mismatch. The suite already
      # covers those vectors directly; running the sample too is what keeps the
      # example itself from rotting silently as the contract evolves — an
      # example that no longer compiles or no longer agrees with the server is
      # the one artifact people copy into their own service.
      - name: Run reactor sample against the §22.13 vectors (CONTRACT.md §22.11)
        run: ./build/examples/axiam_example_reactor

  sanitizers:
    # §13.4 observation 10 / §12.6.1. OBS-4 was a signed-integer overflow (UB)
    # in this repository's base64url decoder — on the token-decode path — and it
    # survived three security passes because the only legs here were gcc/clang
    # builds plus coverage. An ordinary build does not report UB, so nothing was
    # ever going to catch it; the suite already passes cleanly under these
    # tools, so wiring them in costs a few minutes and closes the class.
    name: ASan+UBSan & valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev valgrind

      # -fno-sanitize-recover=all is load-bearing: without it UBSan prints a
      # diagnostic and carries on, so the run stays green and the finding is
      # only visible to whoever reads the log. Aborting makes it a gate.
      - name: Configure (ASan + UBSan)
        run: |
          cmake -S . -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DAXIAM_BUILD_TESTS=ON \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -fno-sanitize-recover=all -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build (ASan + UBSan)
        run: cmake --build build-asan -j

      - name: Test under ASan + UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build-asan --output-on-failure

      - name: Configure (plain, for valgrind)
        run: cmake -S . -B build-vg -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAXIAM_BUILD_TESTS=ON

      - name: Build (plain)
        run: cmake --build build-vg -j

      # Run the binary directly rather than via ctest: this project uses
      # enable_testing() rather than include(CTest), so there is no
      # MemoryCheckCommand wiring for `ctest -T memcheck` to use.
      - name: Valgrind
        run: |
          valgrind --error-exitcode=9 --leak-check=full \
            --errors-for-leak-kinds=definite -q build-vg/tests/axiam_cpp_tests

  tls-bypass-gate:
    name: TLS-bypass lint gate (§6)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for TLS-verification bypass patterns
        run: |
          set -e
          if grep -rnE 'CURLOPT_SSL_VERIFYPEER[^\n]*0|CURLOPT_SSL_VERIFYHOST[^\n]*0' \
               --include='*.cpp' --include='*.hpp' src include tests; then
            echo "::error::TLS-verification bypass pattern found (violates CONTRACT §6)"
            exit 1
          fi
          if grep -rniE 'skip_tls|allow_insecure|disable_tls|insecure_skip' \
               --include='*.cpp' --include='*.hpp' src include; then
            echo "::error::insecure TLS API surface found (violates CONTRACT §6)"
            exit 1
          fi
          echo "No TLS-bypass patterns found."

  secret-scan-gate:
    name: no committed private keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grep for private key material
        run: |
          if git grep -nE 'BEGIN (RSA |EC )?PRIVATE KEY' -- .; then
            echo "::error::committed private key material found"
            exit 1
          fi
          echo "No committed private keys."

  validate-packaging:
    name: validate vcpkg + conan recipes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate vcpkg manifests (JSON well-formed)
        run: |
          python3 -c "import json; json.load(open('vcpkg.json'))"
          python3 -c "import json; json.load(open('ports/axiam-cpp-sdk/vcpkg.json'))"
      - name: Validate conanfile imports
        run: |
          python3 -m pip install --quiet "conan>=2.0"
          conan inspect . > /dev/null
      - name: Portfile references the version
        run: grep -q 'ilpanich/axiam-cplusplus-sdk' ports/axiam-cpp-sdk/portfile.cmake

  verify-tag-on-main:
    name: verify-tag-on-main
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure the tag commit is contained in main
        run: |
          git fetch origin main --depth=100
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag commit is on main."
          else
            echo "::error::tag ${GITHUB_REF_NAME} is not an ancestor of main"
            exit 1
          fi

  release:
    name: release (CPack tarball)
    needs: [build-test, tls-bypass-gate, secret-scan-gate, validate-packaging, verify-tag-on-main]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libcurl4-openssl-dev libssl-dev
      - name: Configure + build + package
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DAXIAM_BUILD_TESTS=OFF
          cmake --build build -j
          cd build && cpack -G TGZ
      - name: Attach tarball to the release
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.tar.gz
